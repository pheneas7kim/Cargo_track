apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
}
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    namespace "bsl.co.ke.ects"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "bsl.co.ke.ects"
    defaultConfig {

        applicationId "bsl.co.ke.ects"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        missingDimensionStrategy 'react-native-camera', 'general'
         ndk {
            
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            // abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            // abiFilters "arm64-v8a"
        }
        
        externalNativeBuild {
            // For ndk-build, instead use the ndkBuild block.
            cmake {
                // Passes optional arguments to CMake.
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
            }


        sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
    } 

    // keystorepwd ects@#2026

    signingConfigs {
        release {
            keyAlias 'ects'
            keyPassword 'ects@#2026' // Ensure this is secure
            storeFile file('ects.jks') // Ensure the path is correct
            storePassword 'ects@#2026' // Ensure this is secure
        }
    }

    packagingOptions {
      jniLibs {
          useLegacyPackaging false
        }
        
    }

    

     buildTypes {
        release {
            signingConfig signingConfigs.release
            
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    viewBinding {
        enabled = true
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation("com.google.android.gms:play-services-location:21.0.1")

    constraints {
        implementation("com.google.android.gms:play-services-location:21.0.1") {
            because("Previous versions caused interface/class mismatch crashes")
        }
    }
    // --------------------------------------------------

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
